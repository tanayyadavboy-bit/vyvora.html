<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VyVora Studio | Kids Books & Free Printables</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #fff4e6 0%, #ffe3ec 50%, #e7f5ff 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: #2d2a32;
    }

    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 32px 22px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.08);
    }

    .logo-badge {
      width: 78px;
      height: 78px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff7a59, #ffb347);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      box-shadow: 0 6px 16px rgba(255, 122, 89, 0.3);
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 6px;
      color: #1f1b24;
    }

    .tagline {
      font-size: 14px;
      color: #666;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .offer-box {
      background: #fff8eb;
      border: 2px dashed #ffb347;
      border-radius: 16px;
      padding: 18px 16px;
      margin-bottom: 22px;
    }

    .offer-box h2 {
      font-size: 17px;
      color: #d95d39;
      margin-bottom: 6px;
    }

    .offer-box p {
      font-size: 13px;
      color: #555;
      margin-bottom: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 18px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
      font-weight: 700;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, #ff6b6b, #ff8e53);
      color: #ffffff;
      box-shadow: 0 6px 16px rgba(255, 107, 107, 0.3);
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-instagram {
      background: linear-gradient(135deg, #f09433, #dc2743, #bc1888);
      color: #ffffff;
    }

    .btn-facebook {
      background: #1877f2;
      color: #ffffff;
    }

    .btn-whatsapp {
      background: #25d366;
      color: #ffffff;
    }

    footer {
      margin-top: 24px;
      font-size: 12px;
      color: #999;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-badge">🎨</div>
    <h1>VyVora Studio</h1>
    <p class="tagline">Fun Coloring Books, Rhymes & Creative Activities for Kids</p>

    <section class="offer-box">
      <h2>🎁 Free Kids Printables!</h2>
      <p>Apna naam aur email bharein aur paayein free coloring pages seedha apne inbox mein.</p>
      <a
        class="btn btn-primary"
        href="https://docs.google.com/forms/d/e/1FAIpQLSd3Int1yOc4yL-QfmDglngET4rvtv29qj8VdKoqjrEDfQTGPg/viewform?usp=header"
        target="_blank"
        rel="noopener noreferrer"
      >
        📥 Get Free Printables Now
      </a>
    </section>

    <nav class="links">
      <!-- Instagram Link: Agar spelling 'cutekidsactivities' hai to yahan theek kar lein -->
      <a
        class="btn btn-instagram"
        href="https://www.instagram.com/cutekidsactitvities/"
        target="_blank"
        rel="noopener noreferrer"
      >
        📸 Follow on Instagram
      </a>

      <!-- Facebook Link -->
      <a
        class="btn btn-facebook"
        href="https://www.facebook.com/share/16aRYoNHnF9/"
        target="_blank"
        rel="noopener noreferrer"
      >
        👍 Follow on Facebook
      </a>

      <!-- WhatsApp Link: 91XXXXXXXXXX ki jagah apna 10-digit WhatsApp number daalein -->
      <a
        class="btn btn-whatsapp"
        href="https://wa.me/91XXXXXXXXXX?text=Hi%20VyVora%20Studio!%20I%20want%20free%20printables."
        target="_blank"
        rel="noopener noreferrer"
      >
        💬 Chat on WhatsApp
      </a>
    </nav>

    <footer>© 2026 VyVora Studio</footer>
  </main>
</body>
        </html>
